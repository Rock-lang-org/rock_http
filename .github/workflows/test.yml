name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential curl ca-certificates python3
      - name: Install pinned Rock toolchain
        run: |
          curl --proto '=https' -fsSL https://github.com/rock-lang-org/Rock/releases/download/v0.7.0/install.sh -o "$RUNNER_TEMP/install-rock.sh"
          sh "$RUNNER_TEMP/install-rock.sh" v0.7.0
          echo "$HOME/.rockup/bin" >> "$GITHUB_PATH"
      - name: Verify pinned compiler
        run: test "$(rockc --version)" = "rockc 0.7.0"
      - name: Build library artifact
        run: rock artifact
      - name: Build optimized library artifact
        run: rock artifact --release
      - name: Protocol and real socket integration
        run: python3 tests/integration.py
      - name: Optimized protocol and real socket integration
        run: python3 tests/integration.py --release
      - name: Build standalone example
        working-directory: example
        run: rock build
